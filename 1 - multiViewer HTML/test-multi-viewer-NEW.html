    <style>
        /* CUSTOM - New minimal layout for CAD development */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .layout-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: #2a2a2a;
            border-bottom: 2px solid #444;
            gap: 20px;
            flex-shrink: 0;
        }
        
        .layout-icon {
            width: 60px;
            height: 60px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #ccc;
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .layout-icon:hover {
            background: #444;
            border-color: #00aaff;
            color: #00aaff;
            transform: translateY(-2px);
        }
        
        .layout-icon.active {
            background: #00aaff;
            border-color: #0088cc;
            color: white;
        }
        
        .viewer-container {
            flex: 1;
            width: 100%;
            background: #2a2a2a;
            position: relative;
            display: block;
            box-sizing: border-box;
            min-height: 0; /* Important for flex child */
        }
        
        /* Hide old controls */
        .controls {
            display: none;
        }
        
        button {
            margin: 5px;
            padding: 8px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0052a3;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .status {
            background: #333;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        .potree-multi-viewer-container {
            border: 1px solid #666;
        }
        
        .potree-viewer-container {
            border: 2px solid #0088ff !important;
            background: #222222 !important;
            min-width: 100px !important;
            min-height: 100px !important;
            overflow: visible !important;
        }
        
        .potree-viewer-container canvas {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .potree-viewer-label {
            color: white !important;
            background: rgba(0, 100, 200, 0.8) !important;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Dependencies -->
    <link rel="stylesheet" type="text/css" href="./build/potree/potree.css">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        
        .container {
            width: 100% !important;

<body>
    <h1>Potree Multi-Viewer Test - Real Implementation</h1>
    <p>Testing actual viewer creation, layout management, and synchronization.</p>
    
    <div class="controls">
        <button onclick="testCreateViewers()" id="createViewersBtn" disabled>Create Viewers (2)</button>
        <button onclick="testLayout1x2()" id="layout1x2Btn" disabled>Layout Main+2 Side</button>
        <button onclick="testLayout2x2()" id="layout2x2Btn" disabled>Layout 2x2 (4 viewers)</button>
        <button onclick="toggleSync()" id="toggleSyncBtn" disabled>Toggle Sync (OFF)</button>
        <button onclick="toggleLockFocus()" id="lockFocusBtn" disabled>Lock Focus (OFF)</button>
        <button onclick="testAddViewer()" id="addViewerBtn" disabled>Add Viewer</button>
        <button onclick="testRemoveViewer()" id="removeViewerBtn" disabled>Remove Viewer</button>
        <button onclick="testIdentification()" id="identificationBtn" disabled>Test Identification</button>
        <button onclick="testStatus()" id="statusBtn" disabled>Show Status</button>
        <button onclick="testMaterialClone()">Test Material Clone</button>
        <button onclick="testMaterialIsolation()" id="testIsolationBtn">Test Material Isolation</button>
        <button onclick="testComprehensiveMaterialIsolation()" id="testComprehensiveBtn" style="background: #4CAF50; color: white; font-weight: bold;">🧪 Test All Fixes</button>
        
        <!-- Performance Monitoring Controls -->
        <br><br><strong>Performance Monitoring:</strong><br>
        <button onclick="testRenderingPerformance()" id="performanceBtn" disabled>Performance Test</button>
        <button onclick="startPerformanceMonitoring()" id="startMonitorBtn" disabled>Start Monitor</button>
        <button onclick="stopPerformanceMonitoring()" id="stopMonitorBtn" disabled>Stop Monitor</button>
        <button onclick="testForceRender()" id="forceRenderBtn" disabled>Force Render</button>
        
        <!-- Cross-Viewer Communication Controls -->
        <br><br><strong>Cross-Viewer Communication:</strong><br>
        <button onclick="testCommunicationSystem()" id="commSystemBtn" disabled>Test Communication</button>
        <button onclick="testSharedGeometry()" id="sharedGeomBtn" disabled>Test Shared Geometry</button>
        <button onclick="testDrawLine()" id="drawLineBtn" disabled>Draw Shared Line</button>
        <button onclick="testClearShared()" id="clearSharedBtn" disabled>Clear Shared Objects</button>
        <button onclick="testCommStats()" id="commStatsBtn" disabled>Communication Stats</button>
        
        <!-- Configuration Persistence Controls -->
        <br><br><strong>Configuration Persistence:</strong><br>
        <button onclick="testSaveConfiguration()" id="saveConfigBtn" disabled>Save Config</button>
        <button onclick="testLoadConfiguration()" id="loadConfigBtn" disabled>Load Config</button>
        <button onclick="testListConfigurations()" id="listConfigBtn" disabled>List Configs</button>
        <button onclick="testExportConfiguration()" id="exportConfigBtn" disabled>Export Config</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="testImportConfiguration(this)">
        <button onclick="document.getElementById('importFileInput').click()" id="importConfigBtn" disabled>Import Config</button>
        <button onclick="testDeleteConfiguration()" id="deleteConfigBtn" disabled>Delete Config</button>
        
        <!-- Viewer Sidebar Controls -->
        <br><br><strong>Viewer Sidebars:</strong><br>
        <button onclick="testOpenAllSidebars()" id="openAllSidebarsBtn" disabled>Open All Sidebars</button>
        <button onclick="testCloseAllSidebars()" id="closeAllSidebarsBtn" disabled>Close All Sidebars</button>
        <button onclick="testSidebarStats()" id="sidebarStatsBtn" disabled>Sidebar Stats</button>
        <button onclick="testSidebarAPI()" id="sidebarAPIBtn" disabled>Test Sidebar API</button>
        
        <button onclick="testDestroy()" id="destroyBtn" disabled>Destroy</button>
    </div>
    
    <div id="viewer-container" class="container"></div>
    
    
    <!-- Load Potree as traditional script instead of ES6 module -->
    <script src="./build/potree/potree.js"></script>
    <!-- Load LAS/LAZ support after potree.js -->
    <script src="./libs/plasio/js/laslaz.js"></script>
    <!-- Load ViewerAttributeManager -->
    <script src="./src/viewer/ViewerAttributeManager-NEW.js"></script>
    
    <script>
        let multiViewer = null;
        let testViewers = [];
        
        // Initialize ViewerAttributeManager
        window.viewerAttributeManager = new ViewerAttributeManager();
        
        // Potree is now available globally as window.Potree
        
        // Test utilities
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] ${message}`);
        }
        
        function enableButton(id) {
            document.getElementById(id).disabled = false;
        }
        
        function disableButton(id) {
            document.getElementById(id).disabled = true;
        }
        
        // Test 1: Create MultiViewer
        window.testCreateMultiViewer = async function() {
            try {
                log('Creating real MultiViewer...');
                log('Checking Potree exports...');
                
                // Debug: Check what's available in Potree (now using global window.Potree)
                console.log('Potree object:', window.Potree);
                console.log('Potree.MultiViewer:', window.Potree ? window.Potree.MultiViewer : 'undefined');
                console.log('Available Potree exports:', window.Potree ? Object.keys(window.Potree) : 'empty');
                
                const container = document.getElementById('viewer-container');
                
                // Check if basic Potree exports work first
                if (!window.Potree || Object.keys(window.Potree).length === 0) {
                    throw new Error('Potree exports are completely empty - there is a build error preventing all exports');
                }
                
                if (!window.Potree.Viewer) {
                    throw new Error('Basic Potree.Viewer not found. Available: ' + Object.keys(window.Potree).slice(0, 10).join(', '));
                }
                
                log('✓ Basic Potree exports working');
                log('✓ Potree.Viewer available');
                log('Available exports: ' + Object.keys(window.Potree).slice(0, 10).join(', ') + '...');
                
                if (!window.Potree.MultiViewer && !window.Potree.MultiViewerSimple) {
                    throw new Error('MultiViewer classes not found. This is expected while debugging build issues.');
                }
                
                // Try simple version first if MultiViewer is not available
                const MultiViewerClass = window.Potree.MultiViewer || window.Potree.MultiViewerSimple;
                log(`Using ${MultiViewerClass.name} class`);
                log('Creating MultiViewer instance...');
                
                // Create actual MultiViewer using our implementation
                multiViewer = new MultiViewerClass(container, {
                    maxViewers: 4,
                    defaultLayout: '1x1',
                    enableSync: true,
                    autoLoadGUI: false  // Don't auto-load GUI for test
                });
                
                log('MultiViewer instance created, waiting for initialization...');
                
                // Wait for initialization (MultiViewer initializes automatically in constructor)
                await new Promise((resolve) => {
                    if (multiViewer.isReady) {
                        log('MultiViewer was already ready');
                        resolve();
                    } else {
                        log('Waiting for ready event...');
                        multiViewer.addEventListener('ready', () => {
                            log('Ready event received!');
                            resolve();
                        });
                        
                        // Add a timeout as fallback
                        setTimeout(() => {
                            log('⚠️ Initialization timeout, proceeding anyway...');
                            resolve();
                        }, 5000);
                    }
                });
                
                log('✓ MultiViewer created and initialized');
                log('✓ ViewerManager active');
                log('✓ ViewerRegistry ready');
                log('✓ ViewerLayout system ready');
                log('✓ ViewerSync system ready');
                
                enableButton('createViewersBtn');
                enableButton('layout1x2Btn');
                enableButton('layout2x2Btn');
                disableButton('createBtn');
                
            } catch (error) {
                log(`✗ Error creating MultiViewer: ${error.message}`);
                console.error('Full error:', error);
                console.error('Stack:', error.stack);
            }
        };
        
        // Test 2: Create 2 Viewers (main, profile)
        window.testCreateViewers = async function() {
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                log('Setting up 2-viewer layout...');
                
                // Destroy all existing viewers first
                if (testViewers.length > 0) {
                    log('Destroying existing viewers...');
                    for (const viewer of testViewers) {
                        if (viewer.multiViewerConfig && viewer.multiViewerConfig.id) {
                            multiViewer.removeViewer(viewer.multiViewerConfig.id);
                        }
                    }
                    testViewers = [];
                    log('✓ All existing viewers destroyed');
                }
                
                // Create exactly 2 viewers
                const viewerConfigs = [
                    { id: 'main', name: 'Main Viewer' },
                    { id: 'profile', name: 'Profile View' }
                ];
                
                log('Creating 2 viewers...');
                for (const config of viewerConfigs) {
                    log(`Creating viewer '${config.id}'...`);
                    const viewer = await multiViewer.createViewer(config.id, config);
                    testViewers.push(viewer);
                    log(`✓ Created viewer '${config.id}' (${config.name})`);
                }
                
                log(`✓ Created ${testViewers.length} real viewers`);
                
                // Apply 1x2 layout for 2 viewers
                log('Setting layout to 1x2 for 2 viewers...');
                multiViewer.setLayout('1x2');
                log('✓ Layout applied: 2 viewers side by side');
                
                // Auto-load point cloud into all viewers
                log('Auto-loading sample point cloud...');
                await autoLoadPointCloud();
                
                enableButton('toggleSyncBtn');
                enableButton('lockFocusBtn');
                enableButton('addViewerBtn');
                enableButton('removeViewerBtn');
                enableButton('identificationBtn');
                enableButton('statusBtn');
                
                // Enable performance monitoring buttons
                enableButton('performanceBtn');
                enableButton('startMonitorBtn');
                enableButton('forceRenderBtn');
                
                // Enable cross-viewer communication buttons
                enableButton('commSystemBtn');
                enableButton('sharedGeomBtn');
                enableButton('drawLineBtn');
                enableButton('clearSharedBtn');
                enableButton('commStatsBtn');
                
                // Enable configuration persistence buttons
                enableButton('saveConfigBtn');
                enableButton('loadConfigBtn');
                enableButton('listConfigBtn');
                enableButton('exportConfigBtn');
                enableButton('importConfigBtn');
                enableButton('deleteConfigBtn');
                
                // Enable sidebar buttons
                enableButton('openAllSidebarsBtn');
                enableButton('closeAllSidebarsBtn');
                enableButton('sidebarStatsBtn');
                enableButton('sidebarAPIBtn');
                
            } catch (error) {
                log(`✗ Error creating viewers: ${error.message}`);
                console.error(error);
            }
        };
        
        // Auto-load point cloud function (extracted from removed testLoadPointCloud)
        async function autoLoadPointCloud() {
            if (!multiViewer || testViewers.length === 0) {
                log('⚠️ Skipping auto-load: No viewers available');
                return false;
            }
            
            try {
                // Use the same point cloud as in classifications.html example
                const pointCloudUrl = "http://5.9.65.151/mschuetz/potree/resources/pointclouds/opentopography/CA13_1.4/cloud.js";
                const pointCloudName = 'CA13';
                
                log(`Loading point cloud: ${pointCloudName}`);
                log('Using SharedResourceManager - 1 dataset shared across all viewers');
                
                // Use resource sharing to load point cloud into all viewers
                const results = await multiViewer.loadPointCloud(pointCloudUrl, pointCloudName);
                
                log('✓ Point cloud loaded successfully with resource sharing!');
                log(`✓ 1 dataset shared across ${testViewers.length} viewers`);
                
                // Wait a moment for point clouds to be fully loaded and then connect sidebar controls
                setTimeout(() => {
                    log('✓ Reconnecting sidebar controls to loaded point clouds...');
                    reconnectSidebarControls();
                }, 1000);
                
                return true;
                
            } catch (error) {
                log(`⚠️ Auto-load failed: ${error.message}`);
                log('This is normal if the sample URL is not accessible');
                log('You can still test other features');
                return false;
            }
        }
        
        // Reconnect sidebar controls after point cloud loading
        function reconnectSidebarControls() {
            try {
                // Get all viewer sidebars and refresh their connections
                const viewerIds = multiViewer.getViewerIds();
                viewerIds.forEach(viewerId => {
                    const sidebar = multiViewer.getViewerSidebar(viewerId);
                    if (sidebar && sidebar.connectAppearanceControls) {
                        log(`Reconnecting controls for viewer ${viewerId}...`);
                        sidebar.connectAppearanceControls();
                    }
                });
                log('✓ Sidebar controls reconnected to loaded point clouds');
            } catch (error) {
                log(`⚠️ Error reconnecting sidebar controls: ${error.message}`);
            }
        }
        
        // Test 4: Layout Main+2 Side (3 viewers: main, top, bottom)
        window.testLayout1x2 = async function() {
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                log('Setting up Main+2 Side layout...');
                
                // Destroy all existing viewers first
                if (testViewers.length > 0) {
                    log('Destroying existing viewers...');
                    for (const viewer of testViewers) {
                        if (viewer.multiViewerConfig && viewer.multiViewerConfig.id) {
                            multiViewer.removeViewer(viewer.multiViewerConfig.id);
                        }
                    }
                    testViewers = [];
                    log('✓ All existing viewers destroyed');
                }
                
                // Create exactly 3 viewers for main-dual layout
                const viewerConfigs = [
                    { id: 'main', name: 'Main Viewer' },
                    { id: 'top', name: 'Top View' },
                    { id: 'bottom', name: 'Bottom View' }
                ];
                
                log('Creating 3 viewers for main-dual layout...');
                for (const config of viewerConfigs) {
                    const viewer = await multiViewer.createViewer(config.id, config);
                    testViewers.push(viewer);
                    log(`✓ Created viewer '${config.id}' (${config.name})`);
                }
                
                log('Setting layout to main-dual...');
                multiViewer.setLayout('main-dual');
                log('✓ Layout changed to main-dual');
                log('✓ 3 viewers arranged: 1 main view (left) + 2 side viewports (top-right, bottom-right)');
                log('✓ Main viewer: full height, 2/3 width');
                log('✓ Side viewers: 1/2 height each, 1/3 width');
                
                // Auto-load point cloud into all viewers
                log('Auto-loading sample point cloud...');
                await autoLoadPointCloud();
                
                enableButton('layout2x2Btn');
                enableButton('toggleSyncBtn');
                enableButton('lockFocusBtn');
                enableButton('addViewerBtn');
                enableButton('removeViewerBtn');
                enableButton('identificationBtn');
                
                // Enable configuration persistence buttons
                enableButton('saveConfigBtn');
                enableButton('loadConfigBtn');
                enableButton('listConfigBtn');
                enableButton('exportConfigBtn');
                enableButton('importConfigBtn');
                enableButton('deleteConfigBtn');
                
            } catch (error) {
                log(`✗ Error setting layout: ${error.message}`);
            }
        };
        
        // Test 5: Layout 2x2 (4 viewers in grid)
        window.testLayout2x2 = async function() {
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                log('Setting up 2x2 grid layout...');
                
                // Destroy all existing viewers first
                if (testViewers.length > 0) {
                    log('Destroying existing viewers...');
                    for (const viewer of testViewers) {
                        if (viewer.multiViewerConfig && viewer.multiViewerConfig.id) {
                            multiViewer.removeViewer(viewer.multiViewerConfig.id);
                        }
                    }
                    testViewers = [];
                    log('✓ All existing viewers destroyed');
                }
                
                // Create exactly 4 viewers for 2x2 layout
                const viewerConfigs = [
                    { id: 'viewer1', name: 'Viewer 1' },
                    { id: 'viewer2', name: 'Viewer 2' },
                    { id: 'viewer3', name: 'Viewer 3' },
                    { id: 'viewer4', name: 'Viewer 4' }
                ];
                
                log('Creating 4 viewers for 2x2 layout...');
                for (const config of viewerConfigs) {
                    const viewer = await multiViewer.createViewer(config.id, config);
                    testViewers.push(viewer);
                    log(`✓ Created viewer '${config.id}' (${config.name})`);
                }
                
                log('Setting layout to 2x2...');
                multiViewer.setLayout('2x2');
                log('✓ Layout changed to 2x2');
                log('✓ All 4 viewers arranged in 2x2 grid');
                log('✓ Each viewer: 1/2 width, 1/2 height');
                
                // Auto-load point cloud into all viewers
                log('Auto-loading sample point cloud...');
                await autoLoadPointCloud();
                
                enableButton('toggleSyncBtn');
                enableButton('lockFocusBtn');
                enableButton('addViewerBtn');
                enableButton('removeViewerBtn');
                enableButton('identificationBtn');
                
                // Enable configuration persistence buttons
                enableButton('saveConfigBtn');
                enableButton('loadConfigBtn');
                enableButton('listConfigBtn');
                enableButton('exportConfigBtn');
                enableButton('importConfigBtn');
                enableButton('deleteConfigBtn');
                
            } catch (error) {
                log(`✗ Error setting 2x2 layout: ${error.message}`);
            }
        };
        
        
        // Sync Toggle Function
        let syncEnabled = false;
        window.toggleSync = function() {
            console.log('toggleSync called!');
            
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                syncEnabled = !syncEnabled;
                console.log('Setting sync to:', syncEnabled);
                
                multiViewer.setSyncEnabled(syncEnabled);
                
                const toggleBtn = document.getElementById('toggleSyncBtn');
                toggleBtn.textContent = `Toggle Sync (${syncEnabled ? 'ON' : 'OFF'})`;
                toggleBtn.style.backgroundColor = syncEnabled ? '#4CAF50' : '#f44336';
                
                log(`✓ Camera synchronization ${syncEnabled ? 'enabled' : 'disabled'}`);
                
                // Debug: check actual viewer sync states
                const allViewers = multiViewer.getAllViewers();
                Object.keys(allViewers).forEach(id => {
                    const viewer = allViewers[id];
                    const actualSyncState = viewer.multiViewerConfig?.syncEnabled;
                    console.log(`Viewer '${id}' sync state:`, actualSyncState);
                });
                
            } catch (error) {
                log(`✗ Error toggling sync: ${error.message}`);
                console.error(error);
            }
        };

        // Test 6: Dynamic Viewer Creation/Destruction
        let dynamicViewerCounter = 1;
        
        window.testAddViewer = async function() {
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                const currentCount = multiViewer.getViewerCount();
                
                // Progressive layout: 1 → 2 (1x1) → 3 (1x2) → 4 (2x2)
                if (currentCount >= 4) {
                    log('⚠️ Maximum of 4 viewers allowed');
                    log('Current layout progression: 1 viewer → 1x1 → 1x2 → 2x2 (max)');
                    return;
                }
                
                // Use consistent naming pattern: viewer1, viewer2, viewer3, viewer4
                const viewerNumber = currentCount + 1;
                const viewerId = `viewer${viewerNumber}`;
                const viewerName = `Viewer ${viewerNumber}`;
                
                log(`Testing dynamic viewer addition...`);
                log(`Creating viewer: '${viewerId}' (${viewerName})`);
                log(`Progression: ${currentCount} → ${currentCount + 1} viewers`);
                
                const viewer = await multiViewer.addViewer(viewerId, {
                    name: viewerName
                });
                
                if (viewer) {
                    // Add viewer to test array so point cloud loading works
                    testViewers.push(viewer);
                    
                    // Load point cloud into the new viewer
                    try {
                        const pointCloudUrl = "http://5.9.65.151/mschuetz/potree/resources/pointclouds/opentopography/CA13_1.4/cloud.js";
                        const pointCloudName = 'CA13';
                        
                        log(`Loading point cloud into new viewer '${viewerId}'...`);
                        await viewer.loadPointCloud(pointCloudUrl, pointCloudName);
                        log(`✓ Point cloud loaded into viewer '${viewerId}'`);
                    } catch (error) {
                        log(`⚠️ Failed to load point cloud into new viewer: ${error.message}`);
                    }
                    
                    const newCount = multiViewer.getViewerCount();
                    log(`✓ Successfully added viewer '${viewerId}'`);
                    log(`✓ Total viewers: ${newCount}`);
                    log(`✓ Viewer IDs: ${multiViewer.getViewerIds().join(', ')}`);
                    log(`✓ Updated testViewers array (${testViewers.length} viewers)`);
                    
                    // Apply progressive layout based on viewer count
                    let targetLayout = '1x1';
                    let layoutDescription = 'Single viewer (full screen)';
                    
                    if (newCount === 2) {
                        targetLayout = '1x2';
                        layoutDescription = '1x2 layout (2 viewers side by side)';
                    } else if (newCount === 3) {
                        targetLayout = 'main-dual';
                        layoutDescription = 'Main + 2 side viewers layout';
                    } else if (newCount === 4) {
                        targetLayout = '2x2';
                        layoutDescription = '2x2 grid (4 viewers in quadrants)';
                    }
                    
                    // Apply the layout
                    log(`Applying ${targetLayout} layout: ${layoutDescription}`);
                    multiViewer.setLayout(targetLayout);
                    log(`✓ Layout applied: ${layoutDescription}`);
                    
                    // Load point cloud in new viewer if available
                    try {
                        await viewer.loadGUI();
                        if (window.samplePointCloudUrl) {
                            log(`Loading point cloud in new viewer...`);
                            const pc = await viewer.loadPointCloud(window.samplePointCloudUrl);
                            if (pc) {
                                viewer.fitToScreen();
                                log(`✓ Point cloud loaded in '${viewerId}'`);
                            }
                        }
                    } catch (error) {
                        log(`⚠️ Could not load point cloud in new viewer: ${error.message}`);
                    }
                    
                    dynamicViewerCounter++;
                } else {
                    log(`✗ Failed to add viewer '${viewerId}'`);
                }
                
            } catch (error) {
                log(`✗ Error adding viewer: ${error.message}`);
                console.error(error);
            }
        };
        
        window.testRemoveViewer = function() {
            if (!multiViewer) {
                log('✗ MultiViewer not created yet');
                return;
            }
            
            try {
                const currentCount = multiViewer.getViewerCount();
                const viewerIds = multiViewer.getViewerIds();
                log(`Current viewers (${currentCount}): ${viewerIds.join(', ')}`);
                
                if (currentCount <= 1) {
                    log('⚠️ Cannot remove viewer - at least one viewer must remain');
                    log('Current layout progression: 1 viewer → 1x1 → 1x2 → 2x2');
                    return;
                }
                
                // Remove the highest numbered viewer (viewer4, then viewer3, etc.)
                // This works with both predefined (viewer1, viewer2, etc.) and any naming scheme
                const viewerNumbers = viewerIds
                    .filter(id => id.startsWith('viewer'))
                    .map(id => parseInt(id.replace('viewer', '')))
                    .filter(num => !isNaN(num))
                    .sort((a, b) => b - a); // Sort descending
                
                let targetViewer;
                if (viewerNumbers.length > 0) {
                    // Remove highest numbered viewer
                    targetViewer = `viewer${viewerNumbers[0]}`;
                } else {
                    // Fallback: remove the last viewer in the list
                    targetViewer = viewerIds[viewerIds.length - 1];
                }
                
                log(`Testing dynamic viewer removal...`);
                log(`Removing viewer: '${targetViewer}'`);
                log(`Progression: ${currentCount} → ${currentCount - 1} viewers`);

        // Material Isolation Test Function - CUSTOM
        window.testMaterialIsolation = function() {
            log('\n=== TESTING MATERIAL ISOLATION BETWEEN VIEWERS ===');
            
            if (!multiViewer || testViewers.length < 2) {
                log('✗ Need at least 2 viewers with point clouds loaded');
                log('  - Run: Create MultiViewer → Create Viewers → Load point clouds first');
                return;
            }
            
            try {
                log('✓ Testing material isolation between viewers...');
                
                // Get materials from different viewers
                const viewer1 = testViewers[0];
                const viewer2 = testViewers[1];
                
                // Check if viewers have point clouds
                if (!viewer1.scene || !viewer1.scene.pointclouds.length) {
                    log('✗ Viewer 1 has no point clouds loaded');
                    return;
                }
                if (!viewer2.scene || !viewer2.scene.pointclouds.length) {
                    log('✗ Viewer 2 has no point clouds loaded');
                    return;
                }
                
                const pc1 = viewer1.scene.pointclouds[0];
                const pc2 = viewer2.scene.pointclouds[0];
                const material1 = pc1.material;
                const material2 = pc2.material;
                
                log(`✓ Found materials: Viewer1=${material1._viewerId}, Viewer2=${material2._viewerId}`);
                
                // Test 1: Different instances
                const differentInstances = material1 !== material2;
                log(`${differentInstances ? '✅' : '❌'} Different instances: ${differentInstances}`);
                
                // Test 2: Independent size modification
                const originalSize1 = material1.size;
                const originalSize2 = material2.size;
                
                material1.size = 8.0;
                material2.size = 12.0;
                
                const independentSize = (material1.size === 8.0 && material2.size === 12.0);
                log(`${independentSize ? '✅' : '❌'} Independent size: Material1=${material1.size}, Material2=${material2.size}`);
                
                // Test 3: Independent opacity modification  
                material1.opacity = 0.3;
                material2.opacity = 0.7;
                
                const independentOpacity = (material1.opacity === 0.3 && material2.opacity === 0.7);
                log(`${independentOpacity ? '✅' : '❌'} Independent opacity: Material1=${material1.opacity}, Material2=${material2.opacity}`);
                
                // Test 4: Verify viewer IDs are correct
                const correctViewerIds = (material1._viewerId !== material2._viewerId);
                log(`${correctViewerIds ? '✅' : '❌'} Correct viewer IDs: Material1=${material1._viewerId}, Material2=${material2._viewerId}`);
                
                // Calculate results
                const tests = [differentInstances, independentSize, independentOpacity, correctViewerIds];
                const passed = tests.filter(t => t).length;
                const total = tests.length;
                
                log(`\n=== MATERIAL ISOLATION RESULTS ===`);
                log(`✅ Passed: ${passed}/${total}`);
                log(`📊 Success Rate: ${Math.round((passed / total) * 100)}%`);
                
                if (passed === total) {
                    log('🎉 MATERIAL ISOLATION WORKING PERFECTLY!');
                    log('✓ Each viewer now has its own material instance');
                    log('✓ UI changes will only affect the target viewer');
                } else {
                    log('❌ MATERIAL ISOLATION FAILED');
                    log('⚠️  Viewers are still sharing material instances');
                }
                
                // Restore original sizes for UI consistency
                material1.size = originalSize1;
                material2.size = originalSize2;
                
                return { passed, total, success: passed === total };
                
            } catch (error) {
                log(`✗ Material isolation test failed: ${error.message}`);
                console.error('Full error:', error);
                return null;
            }
        };
        
        /**
         * Comprehensive test for all material isolation fixes
         * Tests Layer 1, 2, and 3 fixes implemented to resolve UI sharing issues
         */
        const testComprehensiveMaterialIsolation = () => {
            log('🧪 === COMPREHENSIVE MATERIAL ISOLATION TEST ===');
            
            try {
                // Use the global testViewers array like other tests do
                const viewers = testViewers.slice(0, 3); // Take first 3 viewers
                const materials = [];
                
                if (viewers.length < 2) {
                    log('❌ Need at least 2 viewers for comprehensive test');
                    log('💡 Create more viewers first using the "Add Viewer" button');
                    return null;
                }
                
                // Collect materials from all viewers
                for (let i = 0; i < viewers.length; i++) {
                    const viewer = viewers[i];
                    const material = viewer.scene.pointclouds[0]?.material;
                    if (!material) {
                        log(`❌ No material found for viewer ${i + 1}`);
                        return null;
                    }
                    materials.push(material);
                }
                
                log(`✅ Found materials for ${materials.length} viewers`);
                
                // Test 1: Material instance isolation (Layer 1 fix verification)
                let isolationTests = 0;
                let isolationPassed = 0;
                
                for (let i = 0; i < materials.length; i++) {
                    for (let j = i + 1; j < materials.length; j++) {
                        isolationTests++;
                        if (materials[i] !== materials[j]) {
                            isolationPassed++;
                            log(`✅ Material ${i+1} ≠ Material ${j+1}`);
                        } else {
                            log(`❌ Material ${i+1} === Material ${j+1} (SHARING DETECTED!)`);
                        }
                    }
                }
                
                // Test 2: Classification isolation (Layer 1 fix verification)
                log('\n🔍 Testing Classification Isolation...');
                
                // Save original states
                const originalStates = viewers.map(viewer => ({...viewer.classifications}));
                
                // Test classification change isolation
                let classificationPassed = true;
                const testClassCode = Object.keys(materials[0].classification || {})[0];
                
                if (testClassCode) {
                    // Change classification in viewer 1
                    const originalValue = viewers[0].classifications[testClassCode]?.visible;
                    viewers[0].setClassificationVisibility(testClassCode, !originalValue);
                    
                    // Check if other viewers were affected (they shouldn't be)
                    for (let i = 1; i < viewers.length; i++) {
                        const otherViewerState = viewers[i].classifications[testClassCode]?.visible;
                        if (otherViewerState !== originalValue) {
                            log(`❌ Classification change in viewer 1 affected viewer ${i+1}`);
                            classificationPassed = false;
                        }
                    }
                    
                    if (classificationPassed) {
                        log(`✅ Classification changes are isolated per viewer`);
                    }
                    
                    // Restore original state
                    viewers[0].setClassificationVisibility(testClassCode, originalValue);
                } else {
                    log(`⚠️  No classification codes found to test`);
                }
                
                // Test 3: Attribute range isolation (Layer 2 fix verification) 
                log('\n🎯 Testing Attribute Range Isolation...');
                let attributeRangePassed = true;
                
                for (let i = 0; i < materials.length; i++) {
                    const material = materials[i];
                    
                    // Check if intensity range is valid (not NaN)
                    if (material.intensityRange && Array.isArray(material.intensityRange)) {
                        const [min, max] = material.intensityRange;
                        if (isNaN(min) || isNaN(max)) {
                            log(`❌ Viewer ${i+1} has NaN intensity range: [${min}, ${max}]`);
                            attributeRangePassed = false;
                        } else {
                            log(`✅ Viewer ${i+1} has valid intensity range: [${min}, ${max}]`);
                        }
                    } else {
                        log(`⚠️  Viewer ${i+1} has no intensity range property`);
                    }
                }
                
                // Test 4: Frame-level override prevention (Layer 1 fix verification)
                log('\n⏱️  Testing Frame-Level Override Prevention...');
                let frameOverridePassed = true;
                
                for (let i = 0; i < materials.length; i++) {
                    const material = materials[i];
                    
                    // Check if material has viewer isolation markers
                    if (material._viewerId) {
                        log(`✅ Material ${i+1} has viewer ID: ${material._viewerId}`);
                    } else {
                        log(`⚠️  Material ${i+1} missing viewer ID marker`);
                        frameOverridePassed = false;
                    }
                    
                    if (material._classificationInitialized) {
                        log(`✅ Material ${i+1} has classification initialization marker`);
                    } else {
                        log(`⚠️  Material ${i+1} missing classification initialization marker`);
                    }
                }
                
                // Calculate overall results
                const tests = [
                    { name: 'Material Instance Isolation', passed: isolationPassed === isolationTests },
                    { name: 'Classification Event Isolation', passed: classificationPassed },
                    { name: 'Attribute Range Validity', passed: attributeRangePassed },
                    { name: 'Frame Override Prevention', passed: frameOverridePassed }
                ];
                
                const overallPassed = tests.filter(t => t.passed).length;
                const totalTests = tests.length;
                
                log(`\n=== COMPREHENSIVE TEST RESULTS ===`);
                tests.forEach(test => {
                    log(`${test.passed ? '✅' : '❌'} ${test.name}`);
                });
                
                log(`\n📊 Overall Score: ${overallPassed}/${totalTests}`);
                log(`🎯 Success Rate: ${Math.round((overallPassed / totalTests) * 100)}%`);
                
                if (overallPassed === totalTests) {
                    log('\n🎉 ALL MATERIAL ISOLATION FIXES WORKING!');
                    log('✓ Layer 1: Frame-level classification overrides stopped');
                    log('✓ Layer 2: Attribute range calculation fixed for viewers 2+');
                    log('✓ Layer 3: Classification event isolation implemented');
                    log('✓ Multi-viewer UI issues should now be resolved');
                } else {
                    log('\n⚠️  SOME ISSUES REMAIN');
                    log('🔧 Check the failed tests above for remaining problems');
                }
                
                return { 
                    passed: overallPassed, 
                    total: totalTests, 
                    success: overallPassed === totalTests,
                    details: tests
                };
                
            } catch (error) {
                log(`✗ Comprehensive test failed: ${error.message}`);
                console.error('Full error:', error);
                return null;
            }
        };

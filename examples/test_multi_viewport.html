<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Test Multi-Viewport</title>
    
    <!-- All Potree dependencies -->
    <link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
    
    <style>
        body { margin: 0; padding: 0; background: #111; color: white; font-family: Arial; }
        .container { position: absolute; width: 100%; height: 100vh; }
        .test-area { position: relative; width: 100%; height: 100%; border: 2px solid red; }
    </style>
</head>
<body>
    <!-- All Potree script dependencies -->
    <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="../libs/spectrum/spectrum.js"></script>
    <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="../libs/other/BinaryHeap.js"></script>
    <script src="../libs/tween/tween.min.js"></script>
    <script src="../libs/d3/d3.js"></script>
    <script src="../libs/proj4/proj4.js"></script>
    <script src="../libs/openlayers3/ol.js"></script>
    <script src="../libs/i18next/i18next.js"></script>
    <script src="../libs/jstree/jstree.js"></script>
    <script src="../build/potree/potree.js"></script>
    <script src="../libs/plasio/js/laslaz.js"></script>

    <div class="container">
        <div id="test_area" class="test-area">
            <h1>Testing MultiViewportManager</h1>
            <div id="status">Loading...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from "../libs/three.js/build/three.module.js";
        
        // Set resource path
        window.Potree = window.Potree || {};
        window.Potree.resourcePath = '../build/potree/resources';
        
        console.log('Starting test...');
        
        try {
            // Test basic import
            console.log('THREE loaded:', THREE);
            
            // Test MultiViewportManager import
            const { MultiViewportManager } = await import("../src/components/MultiViewportManager.js");
            console.log('MultiViewportManager imported:', MultiViewportManager);
            
            // Get status element before MultiViewportManager clears the container
            const statusElement = document.getElementById('status');
            
            // Test creating instance
            const testArea = document.getElementById('test_area');
            const manager = new MultiViewportManager(testArea);
            console.log('MultiViewportManager created:', manager);
            
            // Add success message to page title since the status element is cleared
            document.title = 'SUCCESS! MultiViewportManager works.';
            console.log('SUCCESS! MultiViewportManager works.');
            
        } catch (error) {
            console.error('Test failed:', error);
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.innerHTML = `FAILED: ${error.message}`;
                statusElement.style.color = 'red';
            }
            document.title = `FAILED: ${error.message}`;
        }
    </script>
</body>
</html>

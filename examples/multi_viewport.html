<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Multi-Viewport Viewer</title>

	<!-- Existing Potree styles -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
	
	<!-- Basic styling for multi-viewport (replacing Tailwind for now) -->
	<style>
		.bg-gray-900 { background-color: #111827; }
		.bg-gray-800 { background-color: #1f2937; }
		.bg-gray-700 { background-color: #374151; }
		.bg-black { background-color: #000000; }
		.text-white { color: #ffffff; }
		.text-gray-100 { color: #f3f4f6; }
		.text-gray-300 { color: #d1d5db; }
		.text-gray-400 { color: #9ca3af; }
		.text-gray-500 { color: #6b7280; }
		.border { border-width: 1px; }
		.border-gray-700 { border-color: #374151; }
		.border-l { border-left-width: 1px; }
		.w-full { width: 100%; }
		.h-full { height: 100%; }
		.absolute { position: absolute; }
		.relative { position: relative; }
		.flex { display: flex; }
		.items-center { align-items: center; }
		.justify-between { justify-content: space-between; }
		.space-x-2 > * + * { margin-left: 0.5rem; }
		.px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
		.rounded-full { border-radius: 9999px; }
		.font-medium { font-weight: 500; }
		.text-sm { font-size: 0.875rem; }
		.text-xs { font-size: 0.75rem; }
		.transition-colors { transition-property: color, background-color, border-color; }
		.duration-150 { transition-duration: 150ms; }
	</style>
	
	<style>
		/* Override default potree container styles for multi-viewport */
		.potree_container {
			position: absolute; 
			width: 100%; 
			height: 100%; 
			left: 0px; 
			top: 0px;
			display: flex;
		}
		
		#multi_viewport_area {
			flex: 1;
			position: relative;
			background-image: url('../build/potree/resources/images/background.jpg');
		}
		
		/* Sidebar adjustments */
		#potree_sidebar_container {
			width: 300px;
			min-width: 300px;
			max-width: 400px;
			position: relative;
			z-index: 1000;
			overflow-y: auto;
			flex-shrink: 0;
		}
		
		/* Responsive sidebar */
		@media (max-width: 1200px) {
			#potree_sidebar_container {
				width: 250px;
				min-width: 250px;
			}
		}
		
		@media (max-width: 768px) {
			.potree_container {
				flex-direction: column;
			}
			
			#potree_sidebar_container {
				width: 100%;
				height: 200px;
				max-height: 200px;
			}
			
			#multi_viewport_area {
				height: calc(100vh - 200px);
			}
		}
	</style>
</head>

<body class="bg-gray-900 text-white">
	<!-- Scripts - Load BEFORE the module script -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>
	
	<!-- Multi-viewport container -->
	<div class="potree_container">
		<!-- Main multi-viewport area -->
		<div id="multi_viewport_area"></div>
		
		<!-- Sidebar container (preserved functionality) -->
		<div id="potree_sidebar_container" class="bg-gray-800 border-l border-gray-700"></div>
	</div>
	
	<!-- Keyboard shortcuts help -->
	<div id="shortcuts_help" class="fixed bottom-4 left-4 bg-black bg-opacity-75 text-white p-3 rounded-lg text-sm z-50 opacity-75 hover:opacity-100 transition-opacity">
		<div class="font-semibold mb-1">Keyboard Shortcuts:</div>
		<div>Ctrl+1: Main Viewport</div>
		<div>Ctrl+2: Toggle Profile View</div>
		<div>Ctrl+3: Toggle Auxiliary View</div>
		<div>U: Top View (Orthographic)</div>
	</div>
	
	<script type="module">
		import * as THREE from "../libs/three.js/build/three.module.js";
		
		// Set the correct resource path before importing other modules
		window.Potree = window.Potree || {};
		// Use absolute URL for resource path to fix URL constructor errors
		window.Potree.resourcePath = new URL('../build/potree/resources', window.location.href).href;
		
		import { MultiViewportManager } from "../src/components/MultiViewportManager.js";

		// Initialize multi-viewport manager
		const multiViewportArea = document.getElementById("multi_viewport_area");
		console.log('Multi-viewport area:', multiViewportArea);
		
		// Initialize loading message
		multiViewportArea.innerHTML = '<div style="color: white; padding: 20px;">Loading MultiViewportManager...</div>';
		
		try {
			window.multiViewportManager = new MultiViewportManager(multiViewportArea);
			console.log('MultiViewportManager created successfully');
		} catch (error) {
			console.error('Error creating MultiViewportManager:', error);
			
			// Fallback: create a simple test structure
			multiViewportArea.innerHTML = `
				<div style="position: absolute; width: 100%; height: 100%; background: red;">
					<h1 style="color: white; text-align: center; padding-top: 50px;">MultiViewportManager Failed - Check Console</h1>
					<p style="color: white; text-align: center;">Error: ${error.message}</p>
				</div>
			`;
			// Exit the script if MultiViewportManager fails
			throw error;
		}
		
		// Get the main viewport viewer (this becomes our primary viewer)
		const mainViewport = multiViewportManager.getViewport('main');
		if (mainViewport) {
			window.viewer = mainViewport.viewer;
			
			// Debug viewer container
			console.log('Main viewport:', mainViewport);
			console.log('Viewer container:', mainViewport.container);
			console.log('Container dimensions:', {
				width: mainViewport.container.offsetWidth,
				height: mainViewport.container.offsetHeight,
				clientWidth: mainViewport.container.clientWidth,
				clientHeight: mainViewport.container.clientHeight
			});
			console.log('Viewer renderer:', viewer.renderer);
			if (viewer.renderer) {
				console.log('Renderer size:', viewer.renderer.getSize(new THREE.Vector2()));
			}
			
			// Set up the scene description
			viewer.setDescription(`
				Multi-Viewport Potree Viewer Demo
				<br>
				<br>
				This example demonstrates a multi-viewport interface with:
				<ul>
					<li>Main viewport (2/3 width) - Orthographic top view</li>
					<li>Profile viewport (1/3 width, top half) - For profile visualization</li>
					<li>Auxiliary viewport (1/3 width, bottom half) - Additional perspective</li>
				</ul>
				<br>
				<b>Features:</b>
				<ul>
					<li>Resizable viewport borders</li>
					<li>Individual viewport pause/play controls</li>
					<li>Keyboard shortcuts for quick navigation</li>
					<li>Preserved sidebar functionality</li>
				</ul>
			`);

			// Configure viewer settings
			viewer.setEDLEnabled(true);
			viewer.setFOV(60);
			viewer.setPointBudget(2_000_000);
			
			// Load GUI for the main viewport
			viewer.loadGUI(() => {
				$("#menu_filters").next().show();
				viewer.toggleSidebar();
				
				// Load point cloud after GUI is ready
				console.log('Loading point cloud...');
				Potree.loadPointCloud("http://5.9.65.151/mschuetz/potree/resources/pointclouds/opentopography/CA13_1.4/cloud.js", "CA13", function(e){
					console.log('Point cloud loaded:', e);
					console.log('Point cloud object:', e.pointcloud);
					console.log('Point cloud bounding box:', e.pointcloud.boundingBox);
					
					viewer.scene.addPointCloud(e.pointcloud);
					console.log('Point cloud added to scene');
					console.log('Scene point clouds:', viewer.scene.pointclouds);
					
					// Don't override the Z position, let it stay at its natural position
					// e.pointcloud.position.z = 0;
					
					e.pointcloud.position.z = 0;
					let material = e.pointcloud.material;
					material.size = 3;
					material.pointSizeType = Potree.PointSizeType.FIXED;
					material.shape = Potree.PointShape.SQUARE;
					
					// Use the exact same view position as classifications.html
					viewer.scene.view.position.set(694274.518, 3916261.987, 348.732);
					viewer.scene.view.lookAt(694683.097, 3916386.916, 30.879);
					
					console.log('Point cloud configured with exact working parameters');
					console.log('Point cloud geometry:', e.pointcloud.geometry);
					
					console.log('Point cloud setup complete - using exact working coordinates from classifications.html');
					
					// Store reference to point cloud for sharing with other viewports
					window.mainPointCloud = e.pointcloud;
					console.log('Point cloud added to main viewport');
				});
			});

			// Event listeners for multi-viewport
			multiViewportManager.addEventListener('viewport_activated', (e) => {
				console.log(`Viewport ${e.viewportId} activated`);
				
				// When secondary viewports are activated, load the point cloud
				if (e.viewportId !== 'main' && window.mainPointCloud) {
					const viewport = multiViewportManager.getViewport(e.viewportId);
					if (viewport && viewport.viewer) {
						// Add the same point cloud to the activated viewport
						viewport.viewer.scene.addPointCloud(window.mainPointCloud);
						
						// Use scene view to fit instead of viewer.fitToScreen()
						setTimeout(() => {
							try {
								const box = window.mainPointCloud.boundingBox;
								if (box && viewport.viewer.scene.view) {
									const center = box.getCenter(new THREE.Vector3());
									const size = box.getSize(new THREE.Vector3());
									const maxDim = Math.max(size.x, size.y, size.z);
									
									viewport.viewer.scene.view.position.set(center.x, center.y, center.z + maxDim);
									viewport.viewer.scene.view.lookAt(center.x, center.y, center.z);
									
									console.log(`Point cloud loaded and positioned in ${e.viewportId} viewport`);
								} else {
									console.warn(`Could not position camera in ${e.viewportId} viewport`);
								}
							} catch (error) {
								console.warn(`Error positioning camera in ${e.viewportId}:`, error);
							}
						}, 500);
					}
				}
				
				// When profile viewport is activated, it could be used for profile visualization
				if (e.viewportId === 'profile') {
					console.log('Profile viewport ready for profile visualization');
				}
			});

			multiViewportManager.addEventListener('viewport_paused', (e) => {
				console.log(`Viewport ${e.viewportId} paused`);
			});

			multiViewportManager.addEventListener('active_viewport_changed', (e) => {
				console.log(`Active viewport changed to ${e.viewportId}`);
				
				// Keep main viewer as the primary viewer for sidebar functionality
				// The ProfileTool will continue to work with the main viewport
				if (e.viewportId === 'main') {
					window.viewer = multiViewportManager.getViewport('main').viewer;
				}
			});

			// Example: Load point cloud to specific viewport
			// multiViewportManager.loadPointCloudToViewport(pointcloud, 'main');
			
		} else {
			console.error('Failed to initialize main viewport');
		}

		// Add some demo functionality
		window.activateProfileViewport = function() {
			multiViewportManager.activateViewport('profile');
		};

		window.activateAuxiliaryViewport = function() {
			multiViewportManager.activateViewport('auxiliary');
		};

		window.pauseViewport = function(viewportId) {
			multiViewportManager.pauseViewport(viewportId);
		};

		// Debug functions
		window.getActiveViewport = function() {
			return multiViewportManager.getActiveViewport();
		};

		window.getAllViewports = function() {
			return multiViewportManager.getAllViewports();
		};

	</script>
</body>
</html>
